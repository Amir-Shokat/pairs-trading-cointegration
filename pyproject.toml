[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pairs-trading"
version = "1.0.0"
description = "Cointegration-based pairs trading: Engle-Granger pair screening, a bid/ask-aware spread strategy and a simulated limit-order-book exchange for backtesting."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Amirmahdi Shokatabadi"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "statsmodels>=0.13", "matplotlib>=3.5"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
